name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      SKIP_LINK_PREVIEWS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint and format check
        run: npm run check

      # Build must run before typecheck: `tsc --noEmit` depends on the route
      # types Next.js generates into .next/types during `next build`.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck
